name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned, not `stable`: the formatter's output changes between SDK
          # releases, so an unpinned CI fails `dart format --set-exit-if-changed`
          # on code that is correctly formatted locally. Matches pubspec's
          # `^3.11.1`. Raise both this and the pubspec constraint together.
          sdk: 3.11.1

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Validate plugin descriptors
        run: python3 scripts/build_catalog.py --validate-only

      - name: Run tests
        run: dart test
